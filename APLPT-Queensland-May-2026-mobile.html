                    { id: 58, event: "#25", title: "NLH Mini High Roller", type: "nlh", time: "1:00 PM", buyin: "$460", stack: "50K", blinds: "25m", reentry: "Unlimited", guarantee: "$50,000", dealer: true },

                    { id: 62, event: "#28", title: "NLH Teams Event", type: "special", time: "6:00 PM", buyin: "$200", stack: "40K", blinds: "15m", reentry: "Unlimited", guarantee: "-", dealer: false },
                    { id: 63, event: "#2", title: "Main Event Flight 8 Turbo", type: "main-event", time: "7:30 PM", buyin: "$480", stack: "50K", blinds: "15m", reentry: "1 Re-Entry", guarantee: "$200,000", dealer: true },
                    { id: 64, event: "#29", title: "Saturday Night Hyper", type: "nlh", time: "8:00 PM", buyin: "$80", stack: "20K", blinds: "10m", reentry: "Unlimited", guarantee: "-", dealer: false },
                    { id: 65, event: "Sat", title: "Monster Stack Satellite", type: "satellite", time: "9:00 PM", buyin: "$45", stack: "15K", blinds: "15m", reentry: "Unlimited", guarantee: "-", dealer: false }
                ]
            },
            {
                day: "Sun",
                date: "May 17",
                fullDate: "Sunday, May 17, 2026",
                events: [
                    { id: 66, event: "Sat", title: "Monster Stack Satellite", type: "satellite", time: "11:00 AM", buyin: "$45", stack: "15K", blinds: "15m", reentry: "Unlimited", guarantee: "5 Seats", dealer: false },
                    { id: 67, event: "#2", title: "Main Event Day 2", type: "main-event", time: "11:00 AM", buyin: "Qualifiers", stack: "50K", blinds: "40m", reentry: "-", guarantee: "$200,000", dealer: true },
                    { id: 68, event: "#30", title: "Monster Stack", type: "nlh", time: "12:00 PM", buyin: "$360", stack: "75K", blinds: "20m", reentry: "Unlimited", guarantee: "$75,000", dealer: true },
                    { id: 69, event: "#31", title: "PLO", type: "plo", time: "1:00 PM", buyin: "$120", stack: "30K", blinds: "20m", reentry: "Unlimited", guarantee: "-", dealer: false },
                    { id: 70, event: "#32", title: "Sunday NLH", type: "nlh", time: "3:00 PM", buyin: "$100", stack: "30K", blinds: "20m", reentry: "Unlimited", guarantee: "-", dealer: false },
                    { id: 71, event: "#33", title: "Shot Clock Terminator ($200/KO)", type: "bounty", time: "3:30 PM", buyin: "$660", stack: "40K", blinds: "25m", reentry: "Unlimited", guarantee: "-", dealer: true },
                    { id: 72, event: "#34", title: "Freezeout Finisher", type: "nlh", time: "5:00 PM", buyin: "$120", stack: "20K", blinds: "15m", reentry: "No Re-Entry", guarantee: "-", dealer: false }
                ]
            }
        ];

        let selectedEvents = new Set();
        let currentDay = 0;
        let currentView = 'all';
        let filterStates = {
            'main-event': null, 'high-roller': null, 'nlh': null,
            'plo': null, 'satellite': null, 'bounty': null, 'special': null
        };

        function init() {
            renderDayTabs();
            renderEvents();
            setupEventListeners();
        }

        function renderDayTabs() {
            const tabs = document.getElementById('dayTabs');
            tabs.innerHTML = tournamentData.map((day, i) => `
                <button class="day-tab ${i === currentDay ? 'active' : ''}" data-day="${i}">
                    ${day.day}
                    <span class="tab-date">${day.date}</span>
                </button>
            `).join('');
        }

        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            const day = tournamentData[currentDay];
            const filteredEvents = day.events.filter(shouldShowEvent);

            if (filteredEvents.length === 0) {
                container.innerHTML = '<div class="no-events">No events match your filters</div>';
                return;
            }

            container.innerHTML = filteredEvents.map(event => `
                <div class="event-card ${event.type} ${selectedEvents.has(event.id) ? 'selected' : ''}" data-id="${event.id}">
                    <div class="event-header">
                        <span class="event-time">${event.time}</span>
                        ${event.dealer ? '<span class="dealer-badge">Dealer Dealt</span>' : ''}
                    </div>
                    <div class="event-title">${event.title}</div>
                    <div class="event-details">
                        <span class="event-detail buyin">${event.buyin}</span>
                        <span class="event-detail">${event.stack}</span>
                        <span class="event-detail">${event.blinds}</span>
                        ${event.guarantee !== '-' ? `<span class="event-detail guarantee">${event.guarantee}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function shouldShowEvent(event) {
            if (currentView === 'selected' && !selectedEvents.has(event.id)) return false;
            const includes = Object.entries(filterStates).filter(([k, v]) => v === 'include').map(([k]) => k);
            const excludes = Object.entries(filterStates).filter(([k, v]) => v === 'exclude').map(([k]) => k);
            if (excludes.includes(event.type)) return false;
            if (includes.length > 0 && !includes.includes(event.type)) return false;
            return true;
        }

        function setupEventListeners() {
            document.getElementById('dayTabs').addEventListener('click', (e) => {
                const tab = e.target.closest('.day-tab');
                if (tab) {
                    currentDay = parseInt(tab.dataset.day);
                    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderEvents();
                }
            });

            document.getElementById('eventsContainer').addEventListener('click', (e) => {
                const card = e.target.closest('.event-card');
                if (card) {
                    const id = parseInt(card.dataset.id);
                    if (selectedEvents.has(id)) {
                        selectedEvents.delete(id);
                    } else {
                        selectedEvents.add(id);
                    }
                    updateSelectedPanel();
                    renderEvents();
                }
            });

            document.getElementById('filterToggleBtn').addEventListener('click', () => {
                document.getElementById('filtersPanel').classList.toggle('open');
            });

            document.getElementById('filterButtons').addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (btn) {
                    const type = btn.dataset.type;
                    if (filterStates[type] === null) filterStates[type] = 'include';
                    else if (filterStates[type] === 'include') filterStates[type] = 'exclude';
                    else filterStates[type] = null;
                    updateFilterButtons();
                    renderEvents();
                }
            });

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentView = e.target.dataset.view;
                    renderEvents();
                });
            });
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
                const state = filterStates[btn.dataset.type];
                btn.classList.remove('include', 'exclude');
                if (state === 'include') btn.classList.add('include');
                else if (state === 'exclude') btn.classList.add('exclude');
            });
        }

        function updateSelectedPanel() {
            const panel = document.getElementById('selectedPanel');
            document.getElementById('selectedCount').textContent = selectedEvents.size;
            panel.classList.toggle('visible', selectedEvents.size > 0);
            document.body.classList.toggle('has-selection', selectedEvents.size > 0);
        }

        function exportSelectedEvents() {
            const selected = [];
            tournamentData.forEach(day => {
                day.events.forEach(event => {
                    if (selectedEvents.has(event.id)) {
                        selected.push({ ...event, fullDate: day.fullDate });
                    }
                });
            });
            const text = selected.map(e =>
                `${e.fullDate}\n${e.title}\nTime: ${e.time} | Buy-in: ${e.buyin}\nStack: ${e.stack} | Blinds: ${e.blinds}\nDealer Dealt: ${e.dealer ? 'Yes' : 'No'}`
            ).join('\n\n---\n\n');
            const blob = new Blob([`APLPT QUEENSLAND MAY 2026 - MY SCHEDULE\nSouthport Sharks, Gold Coast\n\n${text}`], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'APLPT-Queensland-May-2026-Schedule.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        init();
    </script>
